name: Full pytest

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run full pytest suite
        env:
          PYTHONPATH: .
        run: pytest -q

  # Karo allein gruen zu sehen hat nicht gereicht: die laufende Fassung des
  # Lehrplan-Dienstes lieferte ein Pflichtfeld nicht, und jede Lieferung wurde
  # abgelehnt. Dieser Job faehrt Karo gegen den echten Dienst, nicht gegen eine
  # abgeschriebene JSON-Datei. Er darf nicht uebersprungen werden.
  bridge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: karo
          POSTGRES_PASSWORD: karo
          POSTGRES_DB: karo_curriculum_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U karo -d karo_curriculum_test"
          --health-interval 3s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://karo:karo@127.0.0.1:5432/karo_curriculum_test
      APP_ENV: test
      ALLOW_DESTRUCTIVE_DB_RESET: "YES"
    steps:
      - uses: actions/checkout@v4
        with:
          path: karo-app

      - uses: actions/checkout@v4
        with:
          repository: Ferid1088/karo-curriculum-team
          path: curriculum-team
          token: ${{ secrets.CURRICULUM_TEAM_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: curriculum-team
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r ../karo-app/requirements.txt
          # karo-contract aus diesem Checkout, nicht aus master.
          pip install -e ../karo-app

      - name: Testdatenbank stempeln
        working-directory: curriculum-team
        run: python -m tools.reset_test_db --create --no-backup

      - name: Vertragstest
        working-directory: curriculum-team
        env:
          KARO_APP_PATH: ${{ github.workspace }}/karo-app
          KARO_DATA_DIR: ${{ runner.temp }}/karo-data
        run: |
          set -o pipefail
          pytest tests/test_karo_bridge_contract.py -rs | tee vertrag.log
          if grep -qi "skipped" vertrag.log; then
            echo "::error::Der Vertragstest wurde uebersprungen – das zaehlt als Fehler."
            exit 1
          fi
