<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Igel">
  <!-- Der Igel gehoert zu "Heute". Fuchs, Eule und Biene sind anderswo
       vergeben. Nur sieben grosse Stacheln tragen die Silhouette — mehr und
       feinere wuerden im Tab bei 26 Pixeln zu Matsch verlaufen. -->
  <defs>
    <linearGradient id="igel-stachel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ab8261"/>
      <stop offset="1" stop-color="#7b583f"/>
    </linearGradient>
  </defs>
  <!-- Koerper: eine warme Flaeche, aus der unten das Gesicht schaut. -->
  <ellipse cx="32" cy="41" rx="22" ry="18.5" fill="#f7e0c7"/>
  <ellipse cx="23" cy="58" rx="5" ry="3.2" fill="#e3c4a2"/>
  <ellipse cx="41" cy="58" rx="5" ry="3.2" fill="#e3c4a2"/>
  <!-- Stachelkappe -->
  <path d="M 12.8,42.4 L 4.1,36.9 L 13.5,32.8 L 8.5,23.8 L 18.7,24.7 L 18.6,14.4 L 27.2,20.1 L 32.0,11.0 L 36.8,20.1 L 45.4,14.4 L 45.3,24.7 L 55.5,23.8 L 50.5,32.8 L 59.9,36.9 L 51.2,42.4 Z"
        fill="url(#igel-stachel)" stroke="#6b4c36" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Backen -->
  <ellipse cx="18.5" cy="48" rx="4.4" ry="3.1" fill="#f2a79e" opacity=".5"/>
  <ellipse cx="45.5" cy="48" rx="4.4" ry="3.1" fill="#f2a79e" opacity=".5"/>
  <!-- Augen -->
  <circle cx="25" cy="45.5" r="3" fill="#3d2b1e"/>
  <circle cx="39" cy="45.5" r="3" fill="#3d2b1e"/>
  <circle cx="26.1" cy="44.4" r="1.05" fill="#fff"/>
  <circle cx="40.1" cy="44.4" r="1.05" fill="#fff"/>
  <!-- Schnauze und ein kleiner Mund -->
  <ellipse cx="32" cy="51.6" rx="3" ry="2.3" fill="#3d2b1e"/>
  <ellipse cx="31" cy="50.9" rx=".9" ry=".6" fill="#fff" opacity=".65"/>
  <path d="M32 54.4v1.2M32 55.6c0 1.5-1.6 2.3-3 1.9M32 55.6c0 1.5 1.6 2.3 3 1.9"
        fill="none" stroke="#3d2b1e" stroke-width="1.5" stroke-linecap="round"/>
</svg>
