<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="t">
  <title id="t">Klassenarbeit</title>
  <!-- Eigene Zeichnung in Karos Farben: ein Blatt, das durchgearbeitet ist,
       und ein Funke daneben. Klein als Reitersymbol, groß im Kopf der Seite
       lesbar — deshalb wenige, kräftige Formen. -->
  <g transform="rotate(-7 22 25)">
    <rect x="8" y="9" width="27" height="33" rx="4" fill="#fff" stroke="#4b3ccc" stroke-width="2.4"/>
    <g stroke="#b9c6e4" stroke-width="2.2" stroke-linecap="round">
      <path d="M14 17h12M14 23h15M14 29h9"/>
    </g>
    <path d="M14 35.5l4.2 4.2L27 30" fill="none" stroke="#0e9f6e"
          stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Der Funke: geschafft. -->
  <path d="M38.5 6.5l1.9 4.3 4.6.6-3.4 3.2.9 4.6-4-2.3-4 2.3.9-4.6-3.4-3.2 4.6-.6z"
        fill="#f5a524" stroke="#c97a00" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
