<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="t">
  <title id="t">Biene</title>
  <!-- Flügel zuerst, damit der Körper darüber liegt. Farben wie in
       world-bee.svg, damit der Reiter zur Illustration im Bereich passt. -->
  <g fill="#fff" opacity=".85">
    <ellipse cx="13" cy="9.5" rx="5" ry="3.4" transform="rotate(-24 13 9.5)"/>
    <ellipse cx="19.5" cy="9" rx="4.2" ry="2.9" transform="rotate(14 19.5 9)"/>
  </g>
  <!-- Körper: heller Grundton mit dunklen Streifen. -->
  <g transform="rotate(-12 17 19)">
    <rect x="8" y="14" width="18" height="11" rx="5.5" fill="#f3bc2f"/>
    <path d="M13.4 14h2.6v11h-2.6zM18.6 14h2.6v11h-2.6z" fill="#3b3025"/>
    <path d="M24.4 14.6c1 .9 1.6 2.2 1.6 3.9v2c0 1.7-.6 3-1.6 3.9z" fill="#7b5725"/>
    <circle cx="8.6" cy="19.5" r="5.5" fill="#3b3025"/>
    <circle cx="6.6" cy="18" r="1.05" fill="#fff"/>
  </g>
  <!-- Fühler -->
  <g fill="none" stroke="#3b3025" stroke-width="1.5" stroke-linecap="round">
    <path d="M7.6 14.2c-.7-1.9-.3-3.4 1.3-4.4"/>
    <path d="M10.6 13.1c.1-2 1-3.2 2.8-3.7"/>
  </g>
</svg>
