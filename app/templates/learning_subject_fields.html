<div class="learn-two-col compact"><div class="field"><label for="new-subject">Fach</label><select name="fach" id="new-subject">{% for f in [cfg.subject, 'Mathematik','Deutsch','Englisch','Biologie','Physik','Chemie','Geschichte','Erdkunde','Französisch','Sachunterricht','Informatik']|unique %}<option value="{{ f }}">{{ f }}</option>{% endfor %}</select></div><div class="field"><label for="new-grade">Klasse</label><select name="klasse" id="new-grade">{% for n in range(1,14) %}<option value="{{ n }}" {{ 'selected' if n == cfg.learner_grade }}>{{ n }}. Klasse</option>{% endfor %}</select></div></div>
